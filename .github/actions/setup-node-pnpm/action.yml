name: Setup Node and pnpm
description: Install pnpm, Node.js with the pnpm store cache, frozen dependencies, and an optional Chromium headless shell.
inputs:
  install-chromium-shell:
    description: Install the Playwright Chromium headless shell with system dependencies
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      with:
        version: 12.16.0
    - name: Install Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .node-version
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Install Chromium headless shell
      if: inputs.install-chromium-shell == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps --only-shell chromium
