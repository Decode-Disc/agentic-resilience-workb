<!-- @dsCard group="Workspace" height=420 subtitle="The inventory opened from the dock" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>InventorySheet</title>
<style>
body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}b{font-weight:600}
.stage{position:relative;height:380px;border-radius:var(--radius-xl);overflow:hidden;box-shadow:0 0 0 1px var(--divider)}
.ghost{position:absolute;border-radius:var(--radius-2xl);background:var(--surface-glass);box-shadow:0 0 0 1px var(--divider);filter:blur(2px)}
.dim{position:absolute;inset:0;background:color-mix(in oklab,var(--foreground) 22%,transparent)}
.sheet{position:absolute;left:60px;right:24px;top:28px;bottom:0;border-radius:var(--radius-3xl) var(--radius-3xl) 0 0;overflow:hidden;display:flex;flex-direction:column;background:color-mix(in oklab,var(--card) 94%,transparent);backdrop-filter:blur(var(--blur-glass));box-shadow:inset 0 1px 0 color-mix(in oklab,var(--popover) 90%,transparent),0 0 0 1px var(--chip-edge),0 40px 90px -30px color-mix(in oklab,var(--foreground) 55%,transparent)}
.top{padding:18px 22px 12px;display:flex;align-items:flex-end;gap:14px;background:radial-gradient(ellipse 60% 140% at 20% 0%,color-mix(in oklab,var(--brand-purple) 11%,transparent),transparent 70%)}
.field{display:flex;align-items:center;gap:10px;width:220px;height:36px;padding:0 12px;border-radius:var(--radius-tile);background:var(--card);box-shadow:inset 0 0 0 1px var(--input-border);color:var(--muted-foreground);font-size:13px}
.coll{height:36px;padding:0 12px;border-radius:var(--radius-tile);background:var(--fill-quiet);display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--foreground);text-decoration:none}
.bar{padding:0 22px 12px;display:flex;align-items:center;gap:10px}
.seg{display:flex;align-items:center;gap:2px;padding:3px;border-radius:var(--radius-tile);background:var(--fill-quiet)}
.flt{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:9px;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:var(--muted-foreground);cursor:pointer}
.flt b{font-weight:500;color:var(--foreground)}
.flt-on{background:var(--card);color:var(--foreground);box-shadow:var(--shadow-tab)}
.foot{margin-top:auto;padding:12px 22px;border-top:1px solid var(--divider);background:color-mix(in oklab,var(--foreground) 2.5%,transparent);display:flex;align-items:center;gap:14px}
.use{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius-tile);background:var(--card);box-shadow:0 0 0 1px color-mix(in oklab,var(--foreground) 8%,transparent);font-size:12.5px;line-height:17px}
.qw{flex-shrink:0;width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:10.5px;font-weight:500;background:var(--tint-ink)}
</style></head>
<body>
<div class="stage ds-backdrop">
<span class="ghost" style="left:24px;top:20px;width:46%;height:200px"></span><span class="ghost" style="left:52%;top:20px;width:44%;height:200px"></span><span class="ghost" style="left:24px;top:236px;width:46%;height:200px"></span>
<span class="dim"></span>
<section role="dialog" aria-label="Inventory" class="sheet">
<div class="top"><span style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="ds-label" style="color:var(--accent-foreground)">// Inventory · 126 controlled assertions</span><span style="font-size:22px;line-height:26px;font-weight:500;letter-spacing:-.035em">Which evidence bears on which question</span></span><span class="field"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>Search assertions</span><a href="#close" class="coll"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg>Collapse</a></div>
<div class="bar"><span class="seg"><button type="button" class="flt flt-on">All <b>126</b></button><button type="button" class="flt"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>Fact <b>64</b></button><button type="button" class="flt"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0L10 10H0Z" fill="currentColor"/></svg>Inference <b>31</b></button><button type="button" class="flt"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><rect y="3.5" width="10" height="3" rx="1" fill="currentColor"/></svg>Counter <b>8</b></button></span><label style="margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:500"><input type="checkbox" checked style="width:16px;height:16px;margin:0;accent-color:var(--brand-purple)">Changed recently first</label></div>
<div style="flex:1;border-top:1px solid var(--divider);display:flex;align-items:center;justify-content:center"><span class="ds-meta">Evidence matrix — see EvidenceMatrix</span></div>
<div class="foot"><span class="ds-label" style="color:var(--accent-foreground);flex-shrink:0">A-014 · 3 uses</span><span style="flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><span class="use" style="box-shadow:0 0 0 1px color-mix(in oklab,var(--brand-purple) 35%,transparent)"><span class="qw" style="background:var(--primary);color:var(--primary-foreground)">Q1</span>Supports · one workflow across parties</span><span class="use"><span class="qw">Q2</span>Context · which workflow</span><span class="use"><span class="qw">Q3</span>Context · integrations to replace</span></span></div>
</section></div>
</body>
</html>
