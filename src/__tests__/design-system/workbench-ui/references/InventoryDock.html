<!-- @dsCard group="Workspace" height=380 subtitle="Compact on every screen, expanded on Progress" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>InventoryDock</title>
<style>
body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}b{font-weight:600}
.grid{display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap}
.cmp{width:var(--dock-width);padding:10px 10px 10px 16px;border-radius:var(--radius-xl);display:flex;align-items:center;gap:14px;color:var(--foreground);text-decoration:none}
.exp{width:var(--side-column);padding:18px;border-radius:var(--radius-2xl);display:flex;flex-direction:column;gap:14px;color:var(--foreground);text-decoration:none}
.lgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 14px;font-size:12px;color:var(--muted-foreground)}
.lg{display:flex;align-items:center;gap:6px}.lg b{margin-left:auto;color:var(--foreground);font-weight:500}
.ico{flex-shrink:0;width:36px;height:36px;border-radius:var(--radius-tile);display:inline-flex;align-items:center;justify-content:center;background:var(--fill-quiet)}
.chg{display:flex;align-items:center;gap:8px;font-size:12.5px}
</style></head>
<body class="ds-backdrop">
<div class="grid">
<a href="#inventory" aria-label="Open inventory" class="ds-float exp">
<span style="display:flex;align-items:center;gap:8px"><span class="ds-label">Inventory</span><span class="ds-badge ds-badge-accent"><svg width="5" height="5" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="var(--brand-purple)"/></svg>3 new</span><span class="ico" style="margin-left:auto;width:30px;height:30px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></span></span>
<span style="display:flex;align-items:baseline;gap:8px"><b style="font-size:36px;line-height:36px;font-weight:500;letter-spacing:-.045em">126</b><span style="font-size:13px;color:var(--muted-foreground)">controlled assertions</span></span>
<span style="display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px"><span style="flex:64;background:var(--evidence-fact)"></span><span style="flex:31;background:var(--evidence-inference)"></span><span style="flex:14;background:var(--evidence-hypothesis)"></span><span style="flex:9;background:color-mix(in oklab,var(--foreground) 25%,transparent)"></span><span style="flex:8;background:var(--counter-evidence)"></span></span><span class="lgs"><span class="lg"><span style="color:var(--evidence-fact)"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="currentColor"/></svg></span>Fact<b>64</b></span><span class="lg"><span style="color:var(--evidence-inference)"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0L10 10H0Z" fill="currentColor"/></svg></span>Inference<b>31</b></span><span class="lg"><span style="color:var(--evidence-hypothesis)"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg></span>Hypothesis<b>14</b></span><span class="lg"><span style="color:var(--evidence-unknown)"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/></svg></span>Unknown<b>9</b></span><span class="lg"><span style="color:var(--counter-evidence)"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><rect y="3.5" width="10" height="3" rx="1" fill="currentColor"/></svg></span>Counter<b>8</b></span></span>
<span class="ds-divider" style="display:flex;flex-direction:column;gap:7px;padding-top:12px"><span class="chg"><span class="ds-badge ds-badge-inference">New</span>A-052 · participation beyond contracts</span><span class="chg"><span class="ds-badge ds-badge-ink">Corrected</span>A-019 · period narrowed</span></span>
</a>
<a href="#inventory" aria-label="Open inventory" class="ds-float cmp">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px"><span style="display:flex;align-items:baseline;gap:8px"><span class="ds-label" style="font-size:10.5px">Inventory</span><b style="font-size:16px;letter-spacing:-.02em">126</b><span style="font-size:12px;color:var(--muted-foreground)">assertions</span><span class="ds-badge ds-badge-accent" style="margin-left:auto;padding:1px 6px"><svg width="5" height="5" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="var(--brand-purple)"/></svg>3 new</span></span><span style="display:flex;height:5px;border-radius:4px;overflow:hidden;gap:2px"><span style="flex:64;background:var(--evidence-fact)"></span><span style="flex:31;background:var(--evidence-inference)"></span><span style="flex:14;background:var(--evidence-hypothesis)"></span><span style="flex:9;background:color-mix(in oklab,var(--foreground) 25%,transparent)"></span><span style="flex:8;background:var(--counter-evidence)"></span></span></span>
<span class="ico"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></span></a>
</div>
</body>
</html>
