<!-- @dsCard group="Metadata" height=250 subtitle="Claim classes, judgment, status and execution" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Badge</title>
<style>
body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}b{font-weight:600}
.wrap{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cap{width:120px}
</style></head>
<body class="ds-backdrop">
<div class="wrap">
<div class="row"><span class="ds-label cap">Claim class</span><span class="ds-badge ds-badge-fact"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><rect width="10" height="10" rx="2" fill="currentColor"/></svg>Fact</span><span class="ds-badge ds-badge-inference"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 0L10 10H0Z" fill="currentColor"/></svg>Inference</span><span class="ds-badge ds-badge-hypothesis"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>Hypothesis</span><span class="ds-badge ds-badge-unknown"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/></svg>Unknown</span><span class="ds-badge ds-badge-counter"><svg width="9" height="9" viewBox="0 0 10 10" aria-hidden="true"><rect y="3.5" width="10" height="3" rx="1" fill="currentColor"/></svg>Counter-evidence</span></div>
<div class="row"><span class="ds-label cap">Judgment</span><span class="ds-badge ds-badge-review"><svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="var(--review)"/></svg>Proposed · for review</span><span class="ds-badge ds-badge-approved"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>Retained · v1</span><span class="ds-badge ds-badge-ink"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Correction requested</span><span class="ds-badge ds-badge-dashed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h12M13 8l4 4-4 4"/></svg>Left for follow-up</span><span class="ds-badge ds-badge-review" style="outline:1px dashed var(--review-foreground);outline-offset:-1px">v2 · pending judgment</span></div>
<div class="row"><span class="ds-label cap">Status</span><span class="ds-badge ds-badge-ink"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>Prepared</span><span class="ds-badge ds-badge-inference"><span class="ds-live" style="width:7px;height:7px;border-radius:50%;background:var(--brand-purple);display:inline-block"></span>Running</span><span class="ds-badge ds-badge-accent"><svg width="5" height="5" viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="5" fill="var(--brand-purple)"/></svg>3 new</span><span class="ds-badge ds-badge-review">2 gaps disclosed</span></div>
<div class="row"><span class="ds-label cap">Execution</span><span class="ds-badge ds-badge-dashed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" stroke-dasharray="3 3"><circle cx="12" cy="12" r="8"/></svg>Unfinished check</span><span class="ds-badge ds-badge-dashed"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Locked</span></div>
</div>
</body>
</html>
