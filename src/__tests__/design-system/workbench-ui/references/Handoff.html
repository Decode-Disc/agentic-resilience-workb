<!-- @dsCard group="Start" height=230 subtitle="Sources ready, opening Progress" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Handoff</title>
<style>
body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}b{font-weight:600}
.card{width:560px;border-radius:var(--radius-3xl);padding:26px 28px;display:flex;flex-direction:column;gap:18px;background:var(--surface-float);-webkit-backdrop-filter:blur(var(--blur-glass));backdrop-filter:blur(var(--blur-glass));box-shadow:var(--shadow-focal)}
.ok{flex-shrink:0;width:38px;height:38px;border-radius:var(--radius-tile);background:var(--foreground);color:var(--card);display:inline-flex;align-items:center;justify-content:center}
.ring{animation:ds-count 3s linear forwards}
@keyframes ds-count{from{stroke-dashoffset:0}to{stroke-dashoffset:113}}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
.btn{height:38px;padding:0 12px;border-radius:var(--radius-tile);border:0;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none}
</style></head>
<body class="ds-backdrop">
<div role="status" class="card">
<span style="display:flex;align-items:center;gap:12px"><span class="ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg></span><span style="flex:1;display:flex;flex-direction:column;gap:2px"><b style="font-size:17px">Sources ready</b><span style="font-size:13px;color:var(--muted-foreground)">38 captured · 29 selected · 9 kept as context</span></span><span class="ds-badge ds-badge-review">2 gaps disclosed</span></span>
<span class="ds-divider" style="display:flex;align-items:center;gap:16px;padding-top:16px">
<span style="position:relative;flex-shrink:0;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="22" cy="22" r="18" fill="none" stroke="var(--fill-quiet)" stroke-width="3"/><circle class="ring" cx="22" cy="22" r="18" fill="none" stroke="var(--brand-purple)" stroke-width="3" stroke-linecap="round" stroke-dasharray="113" stroke-dashoffset="0"/></svg><b style="font-size:16px">3</b></span>
<span style="flex:1;display:flex;flex-direction:column;gap:2px"><b style="font-size:15px">Opening Progress…</b><span style="font-size:13px;color:var(--muted-foreground)">Investigation continues there.</span></span>
<button type="button" class="btn" style="background:transparent;color:var(--foreground);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--foreground) 16%,transparent)">Stay here</button><a href="#progress" class="btn" style="padding:0 14px;background:var(--primary);color:var(--primary-foreground)">Go now</a></span>
</div>
</body>
</html>
