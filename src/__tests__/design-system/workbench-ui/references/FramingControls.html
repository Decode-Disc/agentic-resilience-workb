<!-- @dsCard group="Start" height=380 subtitle="Angles, conversation turns, options and quick replies" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FramingControls</title>
<style>
body{margin:0;padding:20px;background:var(--background);color:var(--foreground);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}*{box-sizing:border-box}b{font-weight:600}
.wrap{display:grid;gap:18px;max-width:640px}
.angle{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--radius-item);border:0;background:var(--surface-glass);box-shadow:0 0 0 1px color-mix(in oklab,var(--foreground) 8%,transparent);font:inherit;font-size:14px;line-height:19px;color:var(--foreground);text-align:left;cursor:pointer;width:100%}
.angle svg{flex-shrink:0;color:var(--brand-purple)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.user{align-self:flex-end;max-width:80%;padding:12px 16px;border-radius:var(--radius-2xl) var(--radius-2xl) 6px var(--radius-2xl);background:var(--tint-ink);font-size:14.5px;line-height:21px}
.opt{height:32px;padding:0 12px;border-radius:var(--radius-tile);border:0;background:var(--card);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--foreground) 14%,transparent);font:inherit;font-size:13.5px;font-weight:500;color:var(--foreground);display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--brand-purple),0 0 0 3px color-mix(in oklab,var(--brand-purple) 16%,transparent);background:color-mix(in oklab,var(--brand-purple) 7%,var(--card))}
.reply{height:34px;padding:0 14px;border-radius:var(--radius-full);border:0;background:var(--card);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--foreground) 14%,transparent);font:inherit;font-size:13.5px;font-weight:500;color:var(--foreground);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
</style></head>
<body class="ds-backdrop">
<div class="wrap">
<div style="display:flex;flex-direction:column;gap:10px"><span class="ds-label" style="padding-left:4px">Try an angle</span><button type="button" class="angle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20L12 4M12 20L20 4"/></svg>Who controls the workflow once agents handle the intake?</button><button type="button" class="angle"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20L12 4M12 20L20 4"/></svg>Which integrations would an agent have to replace?</button></div>
<div style="display:flex;flex-direction:column;gap:12px"><span class="user">Focus on whether CCC holds the claim workflow.</span>
<span class="who"><span class="ds-slash" style="letter-spacing:-.08em">//</span>Workbench</span>
<span style="font-size:14.5px;line-height:21px">Here is a proposed framing. Refine it, or start research as is.</span>
<span class="row"><button type="button" class="opt" aria-pressed="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5 5L20 6.5"/></svg>Claim workflow</button><button type="button" class="opt" aria-pressed="false">Data position</button><button type="button" class="opt" aria-pressed="false">Agent substitution</button></span>
<span class="row"><button type="button" class="reply">Narrow to auto claims</button><button type="button" class="reply">Add a question</button><span style="flex:1"></span><a href="#start" class="ds-launch">Start research<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a></span></div>
</div>
</body>
</html>
