<!-- @dsCard group="Actions" height=170 subtitle="Default, outline, secondary, ghost, destructive, link, launch" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button</title>
<style>
body{margin:0;padding:16px;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}.ds-button-primary{background:var(--primary);color:var(--primary-foreground)}.ds-button-primary:hover:not(:disabled){background:color-mix(in oklab,var(--primary) 80%,transparent)}.ds-button-outline{background:color-mix(in oklab,var(--background) 70%,transparent);color:var(--foreground);border-color:color-mix(in oklab,var(--primary) 35%,transparent)}.ds-button-outline:hover:not(:disabled){background:var(--muted)}[data-theme="dark"] .ds-button-outline{background:transparent}[data-theme="dark"] .ds-button-outline:hover{background:color-mix(in oklab,var(--input) 30%,transparent)}.ds-button-secondary{background:var(--secondary);color:var(--secondary-foreground)}.ds-button-secondary:hover:not(:disabled){background:color-mix(in oklch,var(--secondary),var(--foreground) 5%)}.ds-button-ghost{background:transparent;color:var(--foreground)}.ds-button-ghost:hover:not(:disabled){background:var(--muted)}[data-theme="dark"] .ds-button-ghost:hover{background:color-mix(in oklab,var(--muted) 50%,transparent)}.ds-button-destructive{background:color-mix(in oklab,var(--destructive) 10%,transparent);color:var(--destructive)}.ds-button-destructive:hover:not(:disabled){background:color-mix(in oklab,var(--destructive) 20%,transparent)}.ds-button-destructive:focus-visible{border-color:color-mix(in oklab,var(--destructive) 40%,transparent);box-shadow:0 0 0 3px color-mix(in oklab,var(--destructive) 20%,transparent)}[data-theme="dark"] .ds-button-destructive{background:color-mix(in oklab,var(--destructive) 20%,transparent)}[data-theme="dark"] .ds-button-destructive:hover{background:color-mix(in oklab,var(--destructive) 30%,transparent)}.ds-button-link{background:transparent;color:var(--color-blue-500, oklch(0.623 0.214 259.815));text-underline-offset:4px}.ds-button-link:hover:not(:disabled){text-decoration:underline}
</style></head>
<body>
<div class="row"><button type="button" class="ds-button ds-button-primary">Open workbench</button><button type="button" class="ds-button ds-button-outline">Add source link</button><button type="button" class="ds-button ds-button-secondary">Inspect sources</button><button type="button" class="ds-button ds-button-ghost">Show details</button><button type="button" class="ds-button ds-button-destructive">Remove reference</button><button type="button" class="ds-button ds-button-link">Open original</button><button type="button" class="ds-button ds-button-primary" disabled>Disabled</button></div>
<div class="row" style="margin-top:1.25rem"><a href="#start" class="ds-launch">Start research<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a><button type="button" class="ds-round" aria-label="Continue"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button></div>
</body>
</html>
